<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>이동장례 통합창구 | 한국반려동물이동장례협회</title>
<meta content="화장 완료 후 보호자 동의·전자서명, 장례확인서 발급, 관할 구청 통보, 동물등록 변경신고 안내까지 한 흐름으로 잇는 협회 통합 관리 시스템" name="description"/>
<meta content="noindex,nofollow" name="robots"/>
<link href="images/favicon.svg" rel="icon" type="image/svg+xml"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap">
<style>
/* 레이아웃: 상단 고정 바 + 한 열 카드 흐름, 폰 폭 기준. 상태는 pill, 숫자는 tabular */
:root{
  --bg:#FFFFFF; --fg:#2A2724; --mute:#6F675E; --line:#E4DED4; --panel:#F7F4EE; --panel2:#EFE9DF;
  --accent:#7A6247; --accent-fg:#FFFFFF;
  --ok:#3E6B4B; --ok-soft:#E6EFE7; --warn:#9A6A1B; --warn-soft:#F7EEDC; --bad:#8B2E1F; --bad-soft:#F6E4E0;
  --display:"Noto Serif KR","Noto Sans KR",serif; --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#17150F; --fg:#EDE7DC; --mute:#A89F91; --line:#352F26; --panel:#211E17; --panel2:#2A261E; --accent:#C7A77E; --accent-fg:#1A1610; --ok:#8FC39A; --ok-soft:#1F2E22; --warn:#E0B462; --warn-soft:#30281A; --bad:#E08A7A; --bad-soft:#36211C; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#17150F; --fg:#EDE7DC; --mute:#A89F91; --line:#352F26; --panel:#211E17; --panel2:#2A261E; --accent:#C7A77E; --accent-fg:#1A1610; --ok:#8FC39A; --ok-soft:#1F2E22; --warn:#E0B462; --warn-soft:#30281A; --bad:#E08A7A; --bad-soft:#36211C; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand .mark{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px;flex:none}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{display:block;color:var(--mute);font-size:11.5px;line-height:1.3}
.tabs{display:flex;gap:4px;background:var(--panel);padding:3px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:grid;gap:14px}
.stack{display:grid;gap:14px}
.banner{font-size:13px;border-radius:12px;padding:10px 14px;background:var(--warn-soft);color:var(--warn)}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg);display:grid;gap:12px;min-width:0}
.card.tint{background:var(--panel);border-color:transparent}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hd h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:600;font-size:24px;margin:4px 0 0;text-wrap:balance}
.lead{color:var(--mute);margin:0}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700}
.pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.mute{background:var(--panel2);color:var(--mute)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f{min-width:0}
.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.f .v{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel);font-variant-numeric:tabular-nums;min-height:42px;word-break:break-all}
.f input,.f select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);color:var(--fg);font:inherit;font-variant-numeric:tabular-nums;min-height:42px}
.row{display:flex;gap:8px;align-items:stretch}
.row > input{flex:1;min-width:0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;padding:11px 16px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:transparent;color:var(--accent)}
.btn.sm{padding:8px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;background:var(--panel);border-radius:10px;padding:10px 12px}
.consent{display:grid;gap:8px}
.consent label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.consent label.all{background:var(--panel);font-weight:700;border-color:transparent}
.consent input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent)}
.consent b{display:block;font-size:14px} .consent small{display:block;color:var(--mute);font-size:12.5px;line-height:1.45;margin-top:2px}
.law{font-size:11.5px;color:var(--accent);font-weight:500}
.sig{border:1.5px dashed var(--line);border-radius:12px;background:var(--panel);position:relative;overflow:hidden}
.sig canvas{display:block;width:100%;height:160px;touch-action:none}
.sig .hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px;pointer-events:none}
.sig.has .hint{display:none}
.err{color:var(--bad);font-size:13px;font-weight:500;margin:0}
.cert{border:1px solid var(--line);border-radius:14px;padding:22px 18px;background:var(--bg);display:grid;gap:12px}
.cert h3{margin:0;font-family:var(--display);font-size:22px;text-align:center;letter-spacing:.3em}
.cert .no{text-align:center;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--mute);margin:0} .kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;word-break:keep-all}
.cert .stamp{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.cert .stamp img{height:48px;max-width:180px;object-fit:contain;background:#fff;border-radius:4px}
.seal{min-width:64px;height:64px;padding:0 6px;border-radius:50%;border:2px solid var(--bad);color:var(--bad);display:grid;place-items:center;font-family:var(--display);font-size:12px;text-align:center;line-height:1.15;transform:rotate(-8deg)}
.next{display:grid;gap:10px}
.next a,.next .nb{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.next span{display:block} .next b{display:block} .next small{display:block;color:var(--mute);font-size:12.5px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
th{font-size:11.5px;color:var(--mute);font-weight:500}
td.mono{font-family:var(--mono);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--display);font-weight:600}
.stat small{color:var(--mute);font-size:12px}
.linkbox{display:grid;gap:10px;grid-template-columns:1fr auto;align-items:center}
.linkbox code{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--panel);padding:8px 10px;border-radius:8px;display:block}
#qr{background:#fff;padding:8px;border-radius:8px;width:max-content}
#qr img,#qr canvas{display:block}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.flow div{background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13px}
.flow b{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.foot{font-size:12px;color:var(--mute);line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.loading{color:var(--mute);font-size:14px;padding:24px 0;text-align:center}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%;border:0!important}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="index.html"><div class="mark">K</div><div><b>이동장례 통합창구</b><small>한국반려동물이동장례협회</small></div></a>
  <div class="tabs" role="tablist" id="optabs" hidden>
    <button role="tab" data-view="new" aria-selected="true">새 접수</button>
    <button role="tab" data-view="ledger" aria-selected="false">대장</button>
    <button role="tab" data-view="notice" aria-selected="false">구청 통보</button>
    <button role="tab" data-view="logout" aria-selected="false">나가기</button>
  </div>
</div></header>

<main id="app"><p class="loading">불러오는 중…</p></main>

<!-- ───── 템플릿 ───── -->
<template id="tpl-home">
  <section class="stack">
    <div><h1>화장 현장에서 구청 통보까지, 한 번에</h1>
    <p class="lead">운영자가 기록을 만들면 보호자는 휴대폰 링크로 동의·서명하고 장례확인서를 받습니다. 운영자는 대장에서 관할 구청 통보서를 만듭니다.</p></div>
    <div class="card">
      <div class="hd"><h2>운영자 접속</h2></div>
      <form id="f-login" class="row" autocomplete="off">
        <input id="op-code" placeholder="운영자 접속 코드 (예: ABCD-1234-EFGH)" aria-label="운영자 접속 코드" autocapitalize="characters" spellcheck="false">
        <button class="btn" type="submit">접속</button>
      </form>
      <p class="err" id="login-err" hidden></p>
      <p class="foot" style="margin:0">보호자이신가요? 운영자에게 받은 링크(문자·QR)로 들어오시면 바로 서명 화면이 열립니다.</p>
    </div>
    <div class="card tint">
      <div class="hd"><h2>흐름</h2></div>
      <div class="flow">
        <div><b>현장</b>칩 번호로 동물등록 정보 조회 (농림축산검역본부 API)</div>
        <div><b>보호자</b>휴대폰 링크로 동의 4건 · 전자서명</div>
        <div><b>즉시</b>장례확인서 발급 (시행규칙 별표 12 라-2)</div>
        <div><b>30일 이내</b>운영자 명의 통보서 → 시설 관할 구청 (라-3)</div>
        <div><b>보호자</b>동물등록 변경신고(사망) 안내 (라-7)</div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-new">
  <section class="stack">
    <div class="card">
      <div class="hd"><h2><span class="step">1</span>동물등록 조회</h2><span class="pill mute" id="lk-state">조회 전</span></div>
      <div class="grid">
        <div class="f"><label for="n-no">동물등록번호 15자리 또는 RFID</label><input id="n-no" inputmode="numeric" placeholder="410…"></div>
        <div class="f"><label for="n-owner">소유자 성명 (또는 생년월일 8자리)</label><div class="row"><input id="n-owner"><button class="btn sm" type="button" id="btn-lookup">조회</button></div></div>
      </div>
      <p class="err" id="lk-err" hidden></p>
      <p class="foot" style="margin:0">미등록 동물이거나 조회가 안 되면 아래에 직접 입력하세요. 미등록 동물은 구청 통보 대상이 아닙니다.</p>
    </div>
    <div class="card">
      <div class="hd"><h2><span class="step">2</span>장례 정보</h2></div>
      <div class="grid">
        <div class="f"><label for="n-name">동물 이름</label><input id="n-name"></div>
        <div class="f"><label for="n-breed">품종</label><input id="n-breed"></div>
        <div class="f"><label for="n-species">종류</label><select id="n-species"><option>개</option><option>고양이</option><option>기타</option></select></div>
        <div class="f"><label for="n-sex">성별</label><input id="n-sex"></div>
        <div class="f"><label for="n-weight">실측 체중 (kg)</label><input id="n-weight" inputmode="decimal"></div>
        <div class="f"><label for="n-method">처리 방법</label><select id="n-method"><option>화장</option><option>건조장</option><option>수분해장</option></select></div>
        <div class="f"><label for="n-when">장례 일시</label><input id="n-when" type="datetime-local"></div>
        <div class="f"><label for="n-place">작업 장소</label><input id="n-place" placeholder="구 지정 작업장소"></div>
        <div class="f"><label for="n-org">관할기관 (등록)</label><input id="n-org"></div>
        <div class="f"><label for="n-phone">보호자 연락처 (선택)</label><input id="n-phone" inputmode="tel"></div>
      </div>
      <p class="err" id="cr-err" hidden></p>
      <button class="btn" type="button" id="btn-create">기록 만들고 보호자 링크 받기</button>
    </div>
    <div class="card" id="created" hidden>
      <div class="hd"><h2><span class="step">3</span>보호자에게 링크 전달</h2><span class="pill warn">서명 대기</span></div>
      <div class="linkbox"><code id="c-link"></code><button class="btn sm" type="button" id="btn-copy">복사</button></div>
      <div class="btns"><div id="qr"></div></div>
      <p class="foot" style="margin:0">보호자 휴대폰으로 QR을 찍거나 문자로 링크를 보내세요. 현장에서 바로 받으려면 <a id="c-open" target="_blank" rel="noopener">이 기기에서 서명 화면 열기</a>.</p>
      <div class="btns"><button class="btn sm sec" type="button" id="btn-again">새 접수</button></div>
    </div>
  </section>
</template>

<template id="tpl-ledger">
  <section class="stack">
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="hd"><h2>장례 대장</h2><button class="btn sm sec" type="button" id="btn-reload">새로고침</button></div>
      <div class="tbl"><table>
        <thead><tr><th>확인서 번호</th><th>장례 일시</th><th>동물</th><th>등록번호</th><th>보호자</th><th>서명</th><th>통보</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="foot">불러오는 중…</td></tr></tbody>
      </table></div>
    </div>
  </section>
</template>

<template id="tpl-notice">
  <section class="stack">
    <div class="card">
      <div class="hd"><h2>통보 대기</h2><span class="foot">서명 완료 · 등록번호 있음 · 아직 통보 안 함</span></div>
      <div class="tbl"><table>
        <thead><tr><th><input type="checkbox" id="nt-all" aria-label="전체 선택"></th><th>처리일자</th><th>동물등록번호</th><th>처리방법</th><th>기한</th></tr></thead>
        <tbody id="nt-rows"></tbody>
      </table></div>
      <div class="btns"><button class="btn" type="button" id="btn-ntview">통보서 만들기</button></div>
    </div>
    <div class="cert print-area" id="nt-doc" hidden>
      <h3 style="letter-spacing:.08em">등록대상동물 사체 처리 내역 통보서</h3>
      <dl class="kv">
        <dt>수신</dt><dd id="nt-to"></dd>
        <dt>업소명</dt><dd id="nt-name"></dd>
        <dt>허가번호 · 전화</dt><dd id="nt-permit"></dd>
        <dt>통보일</dt><dd id="nt-date"></dd>
      </dl>
      <div class="tbl"><table><thead><tr><th>순번</th><th>처리일자</th><th>동물등록번호</th><th>처리방법</th></tr></thead><tbody id="nt-list"></tbody></table></div>
      <p style="margin:0;font-size:13.5px">위 내용을 「동물보호법 시행규칙」 별표 12 제2호 라목 3)에 따라 통보합니다.</p>
      <div class="stamp"><span id="nt-sign"></span><div class="seal" id="nt-seal"></div></div>
    </div>
    <div class="btns" id="nt-actions" hidden>
      <button class="btn sec" type="button" id="btn-ntprint">인쇄 · PDF 저장</button>
      <button class="btn" type="button" id="btn-ntmark">통보 완료로 표시</button>
    </div>
  </section>
</template>

<template id="tpl-owner">
  <section class="stack">
    <div class="banner" id="o-test" hidden>시험 운영자가 만든 기록입니다. 실제 장례·통보와 관계없습니다.</div>
    <div><h1>깊은 위로를 전합니다</h1><p class="lead">아래 내용을 확인하시고 동의·서명해 주시면 장례확인서가 발급됩니다.</p></div>
    <div class="card">
      <div class="hd"><h2><span class="step">1</span>장례 내용 확인</h2></div>
      <dl class="kv" id="o-info"></dl>
    </div>
    <div class="card">
      <div class="hd"><h2><span class="step">2</span>동의</h2></div>
      <div class="consent">

<template id="tpl-cert">
  <section class="stack">

        <div class="nb"><span><b>구청 통보</b><small>운영자가 30일 이내에 시설 관할 구청에 통보합니다</small></span><span class="pill mute">운영자 처리</span></div>
        <div class="nb"><span><b>이 확인서 다시 보기</b><small>이 화면의 주소를 저장해 두시면 언제든 다시 열 수 있습니다</small></span><span class="pill ok">발급 완료</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var API='https://lnmximlbyvewxfetddda.supabase.co/functions/v1/funeral';
  var app=document.getElementById('app'), tabs=document.getElementById('optabs');
  var OP=null, CODE='';
  function ss(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v);}catch(e){return null;} }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function mount(id){ app.innerHTML=''; app.appendChild($(id).content.cloneNode(true)); window.scrollTo({top:0}); if(OP&&!tabs.hidden) opBanner(); }
  var tm; function toast(m){ var t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(tm); tm=setTimeout(function(){t.hidden=true;},2400); }
  function api(body,useCode){ var h={'content-type':'application/json'}; if(useCode) h['x-op-code']=CODE;
    return fetch(API,{method:'POST',headers:h,body:JSON.stringify(body)}).then(function(r){ return r.json().catch(function(){return {error:'서버 응답을 읽지 못했습니다.'};}).then(function(j){ j._status=r.status; return j; }); })
      .catch(function(){ return {error:'인터넷 연결을 확인해 주세요.'}; }); }
  function kdate(iso,withTime){ if(!iso) return ''; var d=new Date(iso); var p=function(n){return String(n).padStart(2,'0');};
    var s=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); return withTime? s+' '+p(d.getHours())+':'+p(d.getMinutes()) : s; }
  function showErr(el,msg){ el.textContent=msg; el.hidden=!msg; }

  // ───── 보호자 화면 ─────
  function ownerFlow(t){
    api({action:'owner_get',t:t}).then(function(j){
      if(j.error){ app.innerHTML='<div class="card"><div class="hd"><h2>링크를 열 수 없습니다</h2></div><p class="lead">'+esc(j.error)+'</p></div>'; return; }
      if(j.record.status==='signed') return renderCert(j);
      mount('tpl-owner'); var r=j.record, op=j.operator||{};
      $('o-test').hidden=!op.is_test;
      $('o-info').innerHTML=[['동물',(r.animal_name||'')+(r.breed?' ('+r.breed+')':'')+(r.weight_kg?' · '+r.weight_kg+' kg':'')],['동물등록번호',r.reg_no||'미등록'],['소유자',r.owner_name],['장례 방법',r.method],['장례 일시',kdate(r.cremated_at,true)],['장소',r.place],['운영자',(op.name||'')+(op.permit_no?' · 허가 '+op.permit_no:'')]]
        .map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1]||'—')+'</dd>';}).join('');
      var all=$('c-all'), subs=[].slice.call(document.querySelectorAll('.c'));
      all.onchange=function(){subs.forEach(function(c){c.checked=all.checked;});};
      subs.forEach(function(c){c.onchange=function(){all.checked=subs.every(function(x){return x.checked;});};});
      var pad=signPad($('sig'),$('sigwrap')); $('btn-clear').onclick=pad.clear;
      $('btn-sign').onclick=function(){
        var e=$('o-err');
        if(!subs.every(function(x){return x.checked;})) return showErr(e,'네 가지 동의에 모두 체크해 주세요.');
        if(!pad.has()) return showErr(e,'서명란에 서명해 주세요.');
        showErr(e,''); var b=this; b.disabled=true; b.textContent='저장 중…';
        api({action:'owner_sign',t:t,consent:{c1:true,c2:true,c3:true,c4:true},signature:pad.png(),owner_phone:$('o-phone').value}).then(function(k){
          if(k.error){ b.disabled=false; b.textContent='서명 완료 · 장례확인서 받기'; return showErr(e,k.error); }
          renderCert(k); toast('장례확인서가 발급되었습니다');
        });
      };
    });
  }
  function renderCert(j){
    mount('tpl-cert'); var r=j.record, op=j.operator||{};
    $('k-test').hidden=!op.is_test;
    $('k-no').textContent='발급번호 '+(r.cert_no||'');
    $('k-info').innerHTML=[['동물 이름',(r.animal_name||'')+(r.breed?' ('+r.breed+(r.weight_kg?', '+r.weight_kg+' kg':'')+')':'')],['동물등록번호',r.reg_no||'미등록'],['소유자',r.owner_name],['장례 방법',r.method],['장례 일시',kdate(r.cremated_at,true)],['장소',r.place],['업소명 · 허가번호',(op.name||'')+(op.permit_no?' · '+op.permit_no:'')],['서명 일시',kdate(r.signed_at,true)]]
      .map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1]||'—')+'</dd>';}).join('');
    var d=new Date(r.cremated_at||r.signed_at);
    $('k-text').textContent='위 동물은 '+d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'. '+(op.name||'')+'에서 장례('+(r.method||'화장')+')를 진행하였음을 확인합니다.';
    $('k-sig').src=r.signature||''; $('k-seal').innerHTML=esc(op.name||'').replace(/\s*\(.*\)/,'')+'<br>인';
    $('btn-print').onclick=function(){ window.print(); };
  }
  function signPad(cv,wrap){
    var ctx=cv.getContext('2d'), drawing=false, has=false, dpr=Math.max(1,window.devicePixelRatio||1);
    function size(){ var r=cv.getBoundingClientRect(); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1a1a1a'; has=false; wrap.classList.remove('has'); }
    size(); window.addEventListener('resize',function(){ if(!has) size(); });
    function pos(e){ var r=cv.getBoundingClientRect(); var p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left,y:p.clientY-r.top}; }
    function down(e){ e.preventDefault(); drawing=true; has=true; wrap.classList.add('has'); var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
    function move(e){ if(!drawing) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
    function up(){ drawing=false; }
    cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
    cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
    return { has:function(){return has;}, clear:function(){ ctx.clearRect(0,0,cv.width,cv.height); has=false; wrap.classList.remove('has'); },
      png:function(){ // 흰 바탕으로 축소 저장
        var w=600,h=Math.round(600*cv.height/cv.width), o=document.createElement('canvas'); o.width=w; o.height=h; var c=o.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,w,h); c.drawImage(cv,0,0,w,h); return o.toDataURL('image/png'); } };
  }

  // ───── 운영자 화면 ─────
  function home(){
    tabs.hidden=true; mount('tpl-home');
    $('f-login').onsubmit=function(ev){ ev.preventDefault(); var c=$('op-code').value.trim().toUpperCase(); if(!c) return;
      CODE=c; api({action:'op_login'},true).then(function(j){ if(j.error){ CODE=''; return showErr($('login-err'),j.error); } ss('kmpfa_op',c); OP=j.operator; opView('new'); }); };
  }
  function setTab(v){ [].forEach.call(tabs.querySelectorAll('button'),function(b){b.setAttribute('aria-selected',b.dataset.view===v?'true':'false');}); }
  tabs.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; if(b.dataset.view==='logout'){ ss('kmpfa_op',null); CODE=''; OP=null; return home(); } opView(b.dataset.view); });
  function opBanner(){ if(OP&&OP.is_test){ var d=document.createElement('div'); d.className='banner'; d.textContent='시험 운영자로 접속 중입니다 ('+OP.name+'). 시험 기록은 실제 통보에 쓰지 마세요.'; app.prepend(d);} }
  function opView(v){ tabs.hidden=false; setTab(v);
    if(v==='new') viewNew(); else if(v==='ledger') viewLedger(); else if(v==='notice') viewNotice(); }

  function viewNew(){
    mount('tpl-new'); var lookupRaw=null;
    var now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset()); $('n-when').value=now.toISOString().slice(0,16);
    $('n-place').value=(OP&&OP.district?OP.district+' 지정 작업장소':'');
    $('btn-lookup').onclick=function(){
      var no=$('n-no').value, ow=$('n-owner').value; if(!no||!ow) return showErr($('lk-err'),'번호와 소유자 성명을 모두 입력해 주세요.');
      showErr($('lk-err'),''); $('lk-state').className='pill mute'; $('lk-state').textContent='조회 중…';
      api({action:'lookup',no:no,owner:ow},true).then(function(j){
        if(!j.ok){ $('lk-state').className='pill bad'; $('lk-state').textContent='조회 실패'; return showErr($('lk-err'),j.error||'조회하지 못했습니다.'); }
        var d=j.data; lookupRaw=j.raw||null; $('lk-state').className='pill ok'; $('lk-state').textContent='등록 정보 확인';
        if(d.reg_no) $('n-no').value=d.reg_no; $('n-name').value=d.animal_name||''; $('n-breed').value=d.breed||''; $('n-sex').value=d.sex||''; $('n-org').value=d.org_name||'';
        if(d.species){ var s=/고양이/.test(d.species)?'고양이':(/개/.test(d.species)?'개':'기타'); $('n-species').value=s; }
      });
    };
    $('btn-create').onclick=function(){
      var b=this, owner=$('n-owner').value.trim(); if(/^\d{6,8}$/.test(owner)) owner='';
      var no=$('n-no').value.replace(/\D/g,'');
      var f={ owner_name:owner, reg_no:no.length===15?no:'', rfid:no.length!==15?no:'', animal_name:$('n-name').value, breed:$('n-breed').value, species:$('n-species').value, sex:$('n-sex').value,
        weight_kg:$('n-weight').value, method:$('n-method').value, cremated_at:$('n-when').value?new Date($('n-when').value).toISOString():'', place:$('n-place').value, org_name:$('n-org').value, owner_phone:$('n-phone').value, lookup_raw:lookupRaw };
      if(!f.owner_name) return showErr($('cr-err'),'소유자 성명을 입력해 주세요. (조회에 생년월일을 썼다면 성명 칸에 이름을 다시 입력)');
      if(!f.animal_name) return showErr($('cr-err'),'동물 이름을 입력해 주세요.');
      showErr($('cr-err'),''); b.disabled=true; b.textContent='만드는 중…';
      api({action:'create',fields:f},true).then(function(j){
        b.disabled=false; b.textContent='기록 만들고 보호자 링크 받기';
        if(j.error) return showErr($('cr-err'),j.error);
        var link=location.origin+location.pathname+'?t='+encodeURIComponent(j.token);
        $('created').hidden=false; $('c-link').textContent=link; $('c-open').href=link;
        $('qr').innerHTML=''; try{ new QRCode($('qr'),{text:link,width:168,height:168,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ $('qr').hidden=true; }
        $('btn-copy').onclick=function(){ copy(link); };
        $('btn-again').onclick=viewNew; $('created').scrollIntoView({behavior:'smooth',block:'start'}); toast(j.cert_no+' 기록을 만들었습니다');
      });
    };
  }
  function copy(text){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){toast('링크를 복사했습니다');},function(){toast('복사하지 못했습니다. 링크를 길게 눌러 복사하세요');}); } else toast('링크를 길게 눌러 복사하세요'); }

  var LIST=[];
  function load(cb){ api({action:'list'},true).then(function(j){ if(j._status===401){ ss('kmpfa_op',null); return home(); } LIST=j.records||[]; cb(); }); }
  function viewLedger(){
    mount('tpl-ledger'); $('btn-reload').onclick=viewLedger;
    load(function(){
      var live=LIST.filter(function(r){return r.status!=='void';});
      var signed=live.filter(function(r){return r.status==='signed';}), pend=live.filter(function(r){return r.status==='pending';});
      var due=signed.filter(function(r){return r.reg_no&&!r.notified_at;});
      $('stats').innerHTML=[[live.length,'전체 기록'],[pend.length,'서명 대기'],[signed.length,'서명 완료'],[due.length,'구청 통보 대기']].map(function(s){return '<div class="stat"><b>'+s[0]+'</b><small>'+s[1]+'</small></div>';}).join('');
      if(!LIST.length){ $('rows').innerHTML='<tr><td colspan="8" class="foot">아직 기록이 없습니다. 새 접수에서 첫 기록을 만드세요.</td></tr>'; return; }
      $('rows').innerHTML=LIST.map(function(r){
        var sg=r.status==='void'?'<span class="pill mute">취소</span>':(r.status==='signed'?'<span class="pill ok">완료</span>':'<span class="pill warn">대기</span>');
        var nt=!r.reg_no?'<span class="pill mute">대상 아님</span>':(r.notified_at?'<span class="pill ok">'+kdate(r.notified_at).slice(5)+'</span>':(r.status==='signed'?'<span class="pill warn">D-'+dleft(r)+'</span>':'—'));
        var link=location.origin+location.pathname+'?t='+encodeURIComponent(r.token);
        return '<tr><td class="mono">'+esc(r.cert_no)+'</td><td>'+kdate(r.cremated_at,true)+'</td><td>'+esc(r.animal_name||'')+(r.weight_kg?' ('+r.weight_kg+' kg)':'')+'</td><td class="mono">'+esc(r.reg_no||'—')+'</td><td>'+esc(r.owner_name||'')+'</td><td>'+sg+'</td><td>'+nt+'</td><td><div class="btns">'
          +(r.status!=='void'?'<a class="btn sm sec" href="'+esc(link)+'" target="_blank" rel="noopener">'+(r.status==='signed'?'확인서':'서명 화면')+'</a><button class="btn sm sec" data-copy="'+esc(link)+'">링크</button>':'')
          +(r.status==='pending'?'<button class="btn sm danger" data-void="'+esc(r.id)+'">취소</button>':'')+'</div></td></tr>';
      }).join('');
      $('rows').onclick=function(e){ var c=e.target.closest('[data-copy]'); if(c) return copy(c.dataset.copy);
        var v=e.target.closest('[data-void]'); if(v){ if(v.dataset.confirm!=='1'){ v.dataset.confirm='1'; v.textContent='정말 취소'; return; }
          api({action:'void',id:v.dataset.void},true).then(function(){ toast('기록을 취소했습니다'); viewLedger(); }); } };
    });
  }
  function dleft(r){ var base=new Date(r.cremated_at||r.created_at).getTime()+30*864e5; return Math.max(0,Math.ceil((base-Date.now())/864e5)); }

  function viewNotice(){
    mount('tpl-notice');
    load(function(){
      var due=LIST.filter(function(r){return r.status==='signed'&&r.reg_no&&!r.notified_at;});
      if(!due.length){ $('nt-rows').innerHTML='<tr><td colspan="5" class="foot">통보할 기록이 없습니다.</td></tr>'; $('btn-ntview').disabled=true; return; }
      $('nt-rows').innerHTML=due.map(function(r){ return '<tr><td><input type="checkbox" class="nt" value="'+esc(r.id)+'" checked aria-label="선택"></td><td>'+kdate(r.cremated_at)+'</td><td class="mono">'+esc(r.reg_no)+'</td><td>'+esc(r.method)+'</td><td><span class="pill warn">D-'+dleft(r)+'</span></td></tr>'; }).join('');
      $('nt-all').checked=true; $('nt-all').onchange=function(){ [].forEach.call(document.querySelectorAll('.nt'),function(c){c.checked=$('nt-all').checked;}); };
      $('btn-ntview').onclick=function(){
        var ids=[].filter.call(document.querySelectorAll('.nt'),function(c){return c.checked;}).map(function(c){return c.value;});
        if(!ids.length) return toast('통보할 기록을 골라 주세요');
        var sel=due.filter(function(r){return ids.indexOf(r.id)>=0;}).sort(function(a,b){return (a.cremated_at||'').localeCompare(b.cremated_at||'');});
        $('nt-to').textContent=(OP.district||'관할')+'청장 (동물보호 담당 부서)'; $('nt-name').textContent=OP.name; $('nt-permit').textContent=(OP.permit_no||'')+' · '+(OP.phone||''); $('nt-date').textContent=kdate(new Date().toISOString());
        $('nt-list').innerHTML=sel.map(function(r,i){ return '<tr><td>'+(i+1)+'</td><td>'+kdate(r.cremated_at)+'</td><td class="mono">'+esc(r.reg_no)+'</td><td>'+esc(r.method)+'</td></tr>'; }).join('');
        $('nt-sign').textContent=OP.name+' (인)'; $('nt-seal').innerHTML=esc(OP.name).replace(/\s*\(.*\)/,'')+'<br>인';
        $('nt-doc').hidden=false; $('nt-actions').hidden=false; $('nt-doc').scrollIntoView({behavior:'smooth',block:'start'});
        $('btn-ntprint').onclick=function(){ window.print(); };
        $('btn-ntmark').onclick=function(){ var b=this; if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='구청에 보냈으면 한 번 더 누르세요'; return; }
          b.disabled=true; api({action:'notice_mark',ids:ids},true).then(function(j){ if(j.error){ b.disabled=false; return toast(j.error); } toast(ids.length+'건을 통보 완료로 표시했습니다'); viewNotice(); }); };
      };
    });
  }

  // ───── 시작 ─────
  var t=new URLSearchParams(location.search).get('t');
  if(t){ ownerFlow(t); return; }
  CODE=ss('kmpfa_op')||'';
  if(CODE){ api({action:'op_login'},true).then(function(j){ if(j.error){ ss('kmpfa_op',null); CODE=''; return home(); } OP=j.operator; opView('new'); }); }
  else home();
})();
</script>
</body>
</html>
