# Supabase에 배포된 서버(api) 코드를 저장소로 가져오기 (수동 실행)
name: Pull server code (api)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN 비밀값이 없습니다"; exit 1; fi
          mkdir -p supabase
          if [ ! -f supabase/config.toml ]; then printf 'project_id = "kmpfa-staff"\n\n[functions.api]\nverify_jwt = false\n' > supabase/config.toml; fi
          supabase functions download api --project-ref aeiguleovssftmaekoil
          ls -la supabase supabase/functions/api
          sha256sum supabase/functions/api/* supabase/config.toml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "서버 코드 가져오기 (Supabase 배포본)"; git push; fi
