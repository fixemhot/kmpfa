# 서버(Supabase Edge Function "api") 자동 배포
# supabase/functions/api/ 아래 파일이 main 에 올라오면 자동으로 배포합니다.
# 필요한 비밀값: 저장소 Settings → Secrets → Actions → SUPABASE_ACCESS_TOKEN
name: Deploy server (api)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/api/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN 비밀값이 없습니다"; exit 1; fi
          supabase functions deploy api --project-ref aeiguleovssftmaekoil --no-verify-jwt --use-api
